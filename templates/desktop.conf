# agentbox box profile: desktop — a full Ubuntu KDE Plasma desktop with hardware GL (complex mode). YOUR copy.
# template-version: 3.21.0                   # bumps whenever this template changes — ab warns if your copy is behind
# Complex mode: INSTALL='…' runs your raw build steps verbatim, so AGENT/PKGS are ignored — this is "write it yourself".
# Here it builds a KDE Plasma desktop on Ubuntu, a real (non-snap) Firefox, and the Mesa GL userspace.
# HEAVY, and honestly so: Plasma + these apps is a ~2 GB first build on a phone. `ab stop` closes it (the box stays,
# so reopening is instant); `ab remove desktop` throws the whole thing away. Want something small? Use the web template.
# GPU note: GPU=virgl below gives you real hardware GL, and Plasma is where that shows — without a GPU the launcher
# switches kwin compositing OFF and puts Plasma's QML on QPainter, because llvmpipe compositing is a slideshow.
# What does NOT work on unrooted Android is an in-box Vulkan driver — distro Mesa builds turnip (Adreno Vulkan) against
# the MSM DRM interface, but Android exposes the GPU as /dev/kgsl-3d0 and blocks /dev/dri, so turnip/Zink enumerate
# nothing and Mesa falls back to llvmpipe (CPU). GPU=virgl sidesteps that: a Termux-side server renders with Android's
# own driver. Check it in a desktop terminal (konsole):
#   glxinfo -B        → "virgl (Adreno …)" means the GPU is doing the work, "llvmpipe" means CPU
#   glxgears -info    · or 'gpu <cmd>' to force one command through virgl when GPU= is off.
DIST=ubuntu                         # full Ubuntu base — these build steps assume Ubuntu package names
DESKTOP=kde                         # the session: kde = full KDE Plasma (fancy, heavy) · xfce = minimal session + wm.
                                    # Either way it wires up KasmVNC — open http://localhost:6902, user: agent
APP=browser                         # browser = no code-server (this build adds real Firefox below) · code = also code-server
MOUNT=cwd                           # cwd = share this folder (opens as /work-<name>) · none = share nothing (sealed)
EPHEMERAL=0                         # 0 = keep it (a full desktop is heavy to rebuild) · 1 = fresh every run, gone on close
TOKENS=""                           # no agent keys needed here — add some if your own build steps want them
LAN=0                               # 1 = also reachable on your Wi-Fi (http://<phone-ip>:6902) · 0 = localhost only (safer)
#RFB=1                              # 1 = ALSO serve this desktop as plain VNC on 127.0.0.1:5901, for a native viewer.
                                    # Why: the browser client is touch-absolute (the pointer lands under your finger).
                                    # Apps with a trackpad mode — AVNC (Gesture style → Touchpad), bVNC (Simulated
                                    # Touchpad) — need plain VNC, which KasmVNC does not speak. Same password.
GPU=virgl                           # render GL on the phone's GPU (this is the GPU-desktop template, so it's on here).
                                    # Costs one socket from the box to a Termux-side GPU server; set empty for CPU only.
#MITM=0                             # 1 = watch the desktop's web traffic through mitmweb (viewer :8083 in the box)
INSTALL='
# --- KDE apps on top of the Plasma session DESKTOP=kde already installs (plasma-desktop, kwin-x11, systemsettings,
# --- konsole, breeze). These are the everyday ones; drop any you do not want to wait for.
apt-get install -y dolphin kate ark gwenview okular plasma-workspace-wallpapers kde-config-gtk-style \
  fonts-noto fonts-noto-color-emoji
# --- a real (non-snap) Firefox from Mozilla, pinned so it wins over Ubuntu snap transitional package ---
install -d -m 0755 /etc/apt/keyrings
curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg -o /etc/apt/keyrings/packages.mozilla.org.asc
echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" > /etc/apt/sources.list.d/mozilla.list
printf "Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n" > /etc/apt/preferences.d/mozilla
apt-get update && apt-get install -y firefox || true
# --- Mesa GL userspace + test tools (libgl1-mesa-dri carries the virgl client GPU=virgl needs; no custom Mesa build) ---
apt-get install -y mesa-utils libgl1-mesa-dri libglx-mesa0
# --- gpu <cmd>: force ONE command through the virgl GPU path. Redundant when GPU=virgl (the whole session already is),
# --- useful when GPU= is off and you want to A/B a single app against llvmpipe ---
cat > /usr/local/bin/gpu <<"SH"
#!/bin/sh
[ -S /tmp/.virgl_test ] || { echo "gpu: no GPU socket — set GPU=virgl in this box profile, then: ab stop; ab <name>" >&2; exit 1; }
export GALLIUM_DRIVER=virpipe MESA_GL_VERSION_OVERRIDE=4.0 VTEST_SOCKET_NAME=/tmp/.virgl_test
exec "$@"
SH
chmod +x /usr/local/bin/gpu
'
